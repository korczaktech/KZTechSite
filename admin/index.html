<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — KZTechSite</title><link rel="stylesheet" href="/admin/admin.css"></head><body><section id="login"><div class="card"><b>KORCZAK TECHNOLOGY</b><h1>Acesso administrativo</h1><p>Área protegida.</p><form id="lf"><input id="e" type="email" placeholder="E-mail" required><input id="s" type="password" placeholder="Senha" required><button>Entrar</button><p id="m"></p></form></div></section><section id="painel" hidden><header><b>KORCZAK TECHNOLOGY · ADMIN</b><button id="out">Sair</button></header><nav><button data-a="visao">Visão geral</button><button data-a="conteudo">Conteúdo</button><button data-a="midias">Mídias</button><button data-a="admins">Administradores</button><button data-a="auditoria">Auditoria</button></nav><main><div id="visao" class="aba"><h1>Visão geral</h1><div id="resumo" class="grid"></div><div class="card"><h3>Editor universal</h3><p>Altere texto, HTML, links, imagens, atributos, estilos, classes e visibilidade de qualquer elemento do frontend usando seletores CSS.</p></div></div><div id="conteudo" class="aba" hidden><div class="top"><h1>Conteúdo</h1><button id="novo">+ Nova regra</button></div><div id="lista"></div></div><div id="midias" class="aba" hidden><div class="top"><h1>Mídias</h1><label class="button">Enviar imagem<input id="file" type="file" accept="image/*" hidden></label></div><div id="media" class="grid"></div></div><div id="admins" class="aba" hidden><div class="top"><h1>Administradores</h1><button id="novoAdmin">+ Novo administrador</button></div><div id="adminLista"></div></div><div id="auditoria" class="aba" hidden><h1>Auditoria</h1><div id="logs"></div></div></main></section><dialog id="dlg"><form id="rf"><input type="hidden" id="id"><label>Página<input id="pg" value="/"></label><label>Seletor CSS<input id="sel" placeholder="#main-content h1" required></label><label>Tipo<select id="tipo"><option>texto</option><option>html</option><option>imagem</option><option>link</option><option>atributo</option><option>estilo</option><option>classe</option><option>visibilidade</option></select></label><label>Atributo<input id="atr"></label><label>Propriedade CSS<input id="prop"></label><label>Valor<textarea id="val" required></textarea></label><label><input id="pub" type="checkbox" checked> Publicado</label><div><button type="button" id="cancel">Cancelar</button><button>Salvar</button></div></form></dialog><dialog id="ad"><form id="af"><label>Nome<input id="an" required></label><label>E-mail<input id="ae" type="email" required></label><label>Senha<input id="ap" type="password" minlength="8" required></label><div><button type="button" id="ac">Cancelar</button><button>Criar</button></div></form></dialog><script src="/admin/admin.js"></script></body></html>
