name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server/index.mjs
      - run: node --check public/assets/app.js
      - run: npm test
      - name: E2E auth flow against Render
        env:
          BASE_URL: https://kztechsite.onrender.com
        run: |
          node <<'NODE'
          const base=process.env.BASE_URL;
          const email=`e2e-${process.env.GITHUB_RUN_ID}@example.invalid`;
          const password=`E2E-Test-${process.env.GITHUB_RUN_ID}-9aB7!`;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(path,options={}){
            const r=await fetch(base+path,{...options,headers:{"content-type":"application/json",...(options.headers||{})}});
            const text=await r.text();
            let body; try{body=JSON.parse(text)}catch{body=text}
            return {status:r.status,body};
          }
          let ready;
          for(let i=0;i<18;i++){
            ready=await req("/api/ready");
            if(ready.status===200&&ready.body?.ready)break;
            await sleep(10000);
          }
          if(ready.status!==200||!ready.body?.ready)throw new Error("Render API não ficou ready: "+JSON.stringify(ready));
          const reg=await req("/api/auth/register",{method:"POST",body:JSON.stringify({name:"E2E Test",email,password})});
          if(reg.status!==201||!reg.body?.token||reg.body?.user?.email!==email)throw new Error("Cadastro falhou: "+JSON.stringify(reg));
          const login=await req("/api/auth/login",{method:"POST",body:JSON.stringify({email,password})});
          if(login.status!==200||!login.body?.token)throw new Error("Login falhou: "+JSON.stringify(login));
          const me=await req("/api/me",{headers:{Authorization:"Bearer "+login.body.token}});
          if(me.status!==200||me.body?.email!==email||me.body?.passwordHash!==undefined)throw new Error("Sessão /api/me falhou: "+JSON.stringify(me));
          console.log("E2E OK: ready -> cadastro MongoDB -> login -> JWT -> /api/me");
          console.log("Test user:",email);
          NODE
