name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Syntax checks
        run: |
          node --check server/index.mjs
          node --check public/assets/app.js
          node --check public/assets/cms.js
          node --check admin/admin.js
          node --check admin/dashboard.js
      - name: Tests
        run: npm test
